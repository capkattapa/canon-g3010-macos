name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: make check
      - name: Build release ZIP
        run: make release
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: Canon-G3010-macOS-release
          path: |
            dist/Canon-G3010-macOS-*.zip
            dist/SHA256SUMS-*.txt
            dist/GITHUB_RELEASE-*.md
